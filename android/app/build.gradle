plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'dev.bubuki.proactive'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.bubuki.proactive'
        minSdk 31
        targetSdk 35
        versionCode 133
        versionName '4.0.45'
        // Never bake any live device-token or private credentials into APK artifacts.
        buildConfigField 'String', 'DEFAULT_DEVICE_TOKEN', '""'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            storeFile file('../../private/release.jks')
            storePassword System.getenv('AGENT_KEYSTORE_PASSWORD') ?: ''
            keyAlias 'proactive'
            keyPassword System.getenv('AGENT_KEYSTORE_PASSWORD') ?: ''
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    testBuildType 'release'
    buildFeatures { compose true; buildConfig true; aidl true }
    packaging {
        jniLibs { useLegacyPackaging = true }
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/versions/*/OSGI-INF/MANIFEST.MF']
        }
    }
    androidResources { noCompress += 'xz' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true; checkReleaseBuilds true }
}
kotlin { compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 } }
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.core:core:1.13.1'
    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.material3
    implementation libs.androidx.activity.compose
    implementation libs.kotlinx.coroutines.android
    implementation libs.commonmark
    implementation libs.commonmark.ext.gfm.tables
    implementation libs.commonmark.ext.gfm.strikethrough
    implementation('com.github.MuntashirAkon:libadb-android:3.1.1') {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk15to18'
        exclude group: 'org.bouncycastle', module: 'bcutil-jdk15to18'
        exclude group: 'org.bouncycastle', module: 'bcpkix-jdk15to18'
    }
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'com.github.mwiede:jsch:2.28.8'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
android {
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

// SDK 35 AIDL includes an unescaped Windows SDK path in a Java comment.
tasks.withType(JavaCompile).configureEach {
    doFirst {
        fileTree(layout.buildDirectory.dir('generated/aidl_source_output_dir')).matching { include '**/*.java' }.each { source ->
            source.text = source.readLines('UTF-8').collect { line ->
                line.startsWith(' * Using:') ? ' * Generated by Android SDK AIDL.' : line
            }.join('\n')
        }
    }
}
